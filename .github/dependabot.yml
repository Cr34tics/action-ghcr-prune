version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      security:
        applies-to: security-updates
        update-types:
          - 'patch'
          - 'minor'
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'patch'
          - 'minor'
      security-major:
        applies-to: security-updates
        update-types:
          - 'major'
      major:
        applies-to: version-updates
        update-types:
          - 'major'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /test
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        update-types:
          - 'patch'
          - 'minor'
      docker-major:
        update-types:
          - 'major'
