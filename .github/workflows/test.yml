name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  format:
    name: Format Check & Auto-fix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Prettier
        run: yarn fmt

      - name: Check for formatting changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push formatting changes (non-fork PRs)
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'chore(fmt): apply prettier formatting'
          git push

      - name: Fail on formatting changes (fork PRs)
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Formatting changes are required."
          echo ""
          echo "Your PR has formatting issues. Please run the following commands locally and push the changes:"
          echo ""
          echo "  yarn fmt"
          echo ""
          echo "Then commit and push the formatted files."
          exit 1

      - name: Add summary
        if: always()
        run: |
          if [ "${{ steps.check_changes.outputs.has_changes }}" != "true" ]; then
            echo "### ✅ Code is properly formatted" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]; then
            echo "### ✨ Code auto-formatted and committed" >> $GITHUB_STEP_SUMMARY
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Type check
        run: yarn type-check

      - name: Add summary
        if: success()
        run: |
          echo "### ✅ Linting and type checking passed" >> $GITHUB_STEP_SUMMARY

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test --coverage

      - name: Add summary
        if: success()
        run: |
          echo "### ✅ All tests passed (19/19)" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports generated successfully" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build action
        run: yarn build

      - name: Check for uncommitted changes
        run: |
          if [[ -n $(git status --porcelain dist/) ]]; then
            echo "Error: dist/ has uncommitted changes after build"
            git status --porcelain dist/
            exit 1
          fi

      - name: Add summary
        if: success()
        run: |
          echo "### ✅ Build successful" >> $GITHUB_STEP_SUMMARY
          echo "dist/ is up to date with source code" >> $GITHUB_STEP_SUMMARY

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Clear node modules
        run: rm -rf node_modules/

      - name: Should prune untagged versions
        uses: ./ # Itself
        id: test_prune_untagged
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: vlaurin
          container: test-action-ghcr-prune
          dry-run: true
          prune-untagged: true
          keep-last: 1

      - name: Expect 2 untagged versions to be pruned
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const actualCount = ${{ steps.test_prune_untagged.outputs.count }};
            const expectedCount = 2;

            if (actualCount !== expectedCount) {
              core.setFailed(`Expected ${expectedCount} versions to be pruned but was: ${actualCount}`)
            }

            const actualPruned = '${{ steps.test_prune_untagged.outputs.prunedVersionIds }}';
            const expectedPruned = '[15452193,15452086]';

            if (actualPruned !== expectedPruned) {
              core.setFailed(`Expected ${expectedPruned} to be pruned but was: ${actualPruned}`)
            }

      - name: Should prune tagged versions without exclusions
        uses: ./ # Itself
        id: test_prune_tagged
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: vlaurin
          container: test-action-ghcr-prune
          dry-run: true
          prune-tags-regexes: ^pr-
          keep-tags: |
            pr-demo

      - name: Expect 3 tagged versions to be pruned
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const actualCount = ${{ steps.test_prune_tagged.outputs.count }};
            const expectedCount = 3;

            if (actualCount !== expectedCount) {
              core.setFailed(`Expected ${expectedCount} versions to be pruned but was: ${actualCount}`)
            }

            const actualPruned = '${{ steps.test_prune_tagged.outputs.prunedVersionIds }}';
            const expectedPruned = '[15452486,15452460,15452388]';

            if (actualPruned !== expectedPruned) {
              core.setFailed(`Expected ${expectedPruned} to be pruned but was: ${actualPruned}`)
            }

      - name: Should prune tagged versions without RegEx exclusions
        uses: ./ # Itself
        id: test_prune_tagged_keep_tags_regexes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: vlaurin
          container: test-action-ghcr-prune
          dry-run: true
          prune-tags-regexes: ^pr-
          keep-tags-regexes: |
            ^pr-[a-z]+
            ^pr-\d\d2

      - name: Expect 2 tagged versions to be pruned
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const actualCount = ${{ steps.test_prune_tagged_keep_tags_regexes.outputs.count }};
            const expectedCount = 2;

            if (actualCount !== expectedCount) {
              core.setFailed(`Expected ${expectedCount} versions to be pruned but was: ${actualCount}`)
            }

            const actualPruned = '${{ steps.test_prune_tagged_keep_tags_regexes.outputs.prunedVersionIds }}';
            const expectedPruned = '[15452486,15452388]';

            if (actualPruned !== expectedPruned) {
              core.setFailed(`Expected ${expectedPruned} to be pruned but was: ${actualPruned}`)
            }

      - name: Should prune tagged versions from many regexes
        uses: ./ # Itself
        id: test_prune_many_tags_regexes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: vlaurin
          container: test-action-ghcr-prune
          dry-run: true
          prune-tags-regexes: |
            ^pr-[a-z]+$
            ^pr-\d{3}$
          keep-tags-regexes: 2$

      - name: Expect 3 tagged versions to be pruned
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const actualCount = ${{ steps.test_prune_many_tags_regexes.outputs.count }};
            const expectedCount = 3;

            if (actualCount !== expectedCount) {
              core.setFailed(`Expected ${expectedCount} versions to be pruned but was: ${actualCount}`)
            }

            const actualPruned = '${{ steps.test_prune_many_tags_regexes.outputs.prunedVersionIds }}';
            const expectedPruned = '[15452525,15452486,15452388]';

            if (actualPruned !== expectedPruned) {
              core.setFailed(`Expected ${expectedPruned} to be pruned but was: ${actualPruned}`)
            }

      # TODO: Upload multi-platform docker image
      - name: Should prune tagged versions from many regexes
        uses: ./ # Itself
        id: test_prune_multi_platform
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: vlaurin
          container: test-action-ghcr-prune
          dry-run: true
          prune-tags-regexes: |
            ^pr-multi1$
          keep-tags-regexes: 2$
          remove-multi-platform: true

      - name: Expect 3 tagged versions to be pruned
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const actualCount = ${{ steps.test_prune_many_tags_regexes.outputs.count }};
            const expectedCount = 3;

            if (actualCount !== expectedCount) {
              core.setFailed(`Expected ${expectedCount} versions to be pruned but was: ${actualCount}`)
            }

            const actualPruned = '${{ steps.test_prune_many_tags_regexes.outputs.prunedVersionIds }}';
            const expectedPruned = '[15452525,15452486,15452388]';

            if (actualPruned !== expectedPruned) {
              core.setFailed(`Expected ${expectedPruned} to be pruned but was: ${actualPruned}`)
            }

      - name: Add summary
        if: success()
        run: |
          echo "### ✅ All integration tests passed" >> $GITHUB_STEP_SUMMARY

  test-status:
    name: test-status
    if: always()
    needs: [format, lint, test, build, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Format | $FORMAT_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | $LINT_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | $TEST_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | $BUILD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | $INTEGRATION_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$FORMAT_RESULT" == "success" ] && \
             [ "$LINT_RESULT" == "success" ] && \
             [ "$TEST_RESULT" == "success" ] && \
             [ "$BUILD_RESULT" == "success" ] && \
             [ "$INTEGRATION_RESULT" == "success" ]; then
            echo "### ✅ All tests succeeded!" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "### ❌ Some tests failed!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
