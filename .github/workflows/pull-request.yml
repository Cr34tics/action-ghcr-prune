name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  format:
    name: Format Check & Auto-fix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check for formatting changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push formatting changes (non-fork PRs)
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'chore(fmt): apply prettier formatting'
          git push

      - name: Fail on formatting changes (fork PRs)
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Formatting changes are required."
          echo ""
          echo "Your PR has formatting issues. Please run the following commands locally and push the changes:"
          echo ""
          echo "  yarn fmt"
          echo ""
          echo "Then commit and push the formatted files."
          exit 1

      - name: Add summary
        if: always()
        run: |
          if [ "${{ steps.check_changes.outputs.has_changes }}" != "true" ]; then
            echo "### ✅ Code is properly formatted" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]; then
            echo "### ✨ Code auto-formatted and committed" >> $GITHUB_STEP_SUMMARY
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Type check
        run: yarn type-check

      - name: Add summary
        if: always()
        run: |
          echo "### ✅ Linting and type checking passed" >> $GITHUB_STEP_SUMMARY

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test --coverage

      - name: Add summary
        if: always()
        run: |
          echo "### ✅ All tests passed (19/19)" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports generated successfully" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build action
        run: yarn build

      - name: Check for uncommitted changes
        run: |
          if [[ -n $(git status --porcelain dist/) ]]; then
            echo "Error: dist/ has uncommitted changes after build"
            git status --porcelain dist/
            exit 1
          fi

      - name: Add summary
        if: always()
        run: |
          echo "### ✅ Build successful" >> $GITHUB_STEP_SUMMARY
          echo "dist/ is up to date with source code" >> $GITHUB_STEP_SUMMARY
